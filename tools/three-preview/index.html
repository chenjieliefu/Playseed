<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Playseed · 3D 素材预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9f4;color:#293e34;font:16px system-ui}header{height:88px;padding:22px 32px;border-bottom:1px solid #dfe6db;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}header span,p{color:#69776c;font-size:14px}main{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 88px)}aside{padding:26px;background:white;overflow:auto}label{display:block;margin:18px 0 8px}input,select,button{font:inherit;border:1px solid #dae2d5;border-radius:12px;padding:11px;background:#f6f8f2;color:inherit;width:100%}button{cursor:pointer;margin-top:12px}button.primary{background:#c9e992;border:0}input[type=color]{height:44px}section{min-width:0;position:relative}canvas{width:100%;height:100%;display:block}#status{position:absolute;bottom:20px;left:24px;right:24px;padding:12px 16px;background:#fffffff0;border-radius:12px;pointer-events:none}small{display:block;color:#768174;line-height:1.7;margin-top:14px}@media(max-width:700px){main{grid-template-columns:210px 1fr}header span{display:none}aside{padding:14px}}
#dimensions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#dimensions label{grid-row:1}#dimensions input{grid-row:2;min-width:0;padding:9px}aside>label{margin-top:12px}input[type=range]{accent-color:#7b9c50}button{padding:10px}small{font-size:12px}</style>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<header><h1>Playseed · 3D 素材预览</h1><span>素材预览 · 入库后通过对话用于3D障碍</span></header>
<main><aside><strong>制作一个简单道具</strong><label>形状</label><select id="shape"><option value="box">方块</option><option value="sphere">圆球</option><option value="cylinder">圆柱</option></select>
<div id="dimensions"><label>宽度</label><input id="width" type="number" min="0.1" max="20" step="0.1" value="2"><label>高度</label><input id="height" type="number" min="0.1" max="20" step="0.1" value="3"><label>深度</label><input id="depth" type="number" min="0.1" max="20" step="0.1" value="2"></div>
<label>颜色</label><input id="color" type="color" value="#99b866"><label>粗糙度</label><input id="roughness" type="range" min="0" max="1" step="0.01" value="0.65"><label>金属感</label><input id="metalness" type="range" min="0" max="1" step="0.01" value="0.1">
<button id="reset">重新制作简单道具</button><button id="import">打开本地模型…</button><input id="file" type="file" accept=".glb" hidden><button class="primary" id="save">保存到当前项目</button><button id="export">导出模型…</button><button id="fit">居中查看</button><small>拖动旋转，滚轮缩放。尺寸采用米。<br>支持不带外部资源的 GLB，最大 20 MB。模型仅在本机读取。<br>保存到项目后，可在App素材区刷新查看；不会自动加入游戏。导出仍通过浏览器保存。请关闭此页前导出，编辑暂不自动保存。</small></aside><section id="stage"><div id="status" role="status">正在准备预览…</div></section></main><script type="module" src="./viewer.js"></script></html>
