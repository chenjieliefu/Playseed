<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playseed · 网页试玩</title><link rel="stylesheet" href="player.css"><body>
<iframe id="stage" src="index.html" title="游戏画面" sandbox="allow-scripts"></iframe>
<nav><button id="exit-preview">退出试玩</button><button id="fullscreen">全屏</button><button id="pause">暂停</button><button id="restart">重开</button><button id="sound">开启声音</button><button id="gesture">开启手势</button><label>音量 <input id="volume" type="range" min="0" max="100" value="30"></label></nav>
<section id="welcome"><div class="intro"><span class="eyebrow">PLAYSEED · 每个想法，都能成为一个世界</span><h1 id="title">正在准备游戏…</h1><p id="intro-controls"></p><button id="start" disabled>开始游戏</button><p class="small">先用鼠标和键盘试玩，也可以在右上方开启手势。</p></div></section>
<div id="paused" hidden>已暂停 · 点击「继续」返回游戏</div>
<aside id="camera-panel" hidden><div class="camera-view"><video id="camera" autoplay playsinline muted></video><canvas id="hand-overlay" width="640" height="480"></canvas></div><p id="camera-framing"></p><div id="hand-status">正在准备手势…</div><p id="hand-help">先选技能，右手横移调左右、前推放远、后收放近，拇指碰食指释放。左手拇指碰四指选技能，握拳换组。竖条显示五指开合，持续合指只释放一次。画面仅在本机处理。</p><label class="aim-setting">瞄准灵敏度 <input id="aim-speed" type="range" min="0.2" max="1.2" step="0.1" value="0.6"><output id="aim-speed-value">0.6×</output></label></aside>
<section id="skillbar" hidden><div class="bank-title"><span id="skill-group"></span><button id="next-group">换组 · Q</button></div><div class="skill-cards"><button id="slot-0"><canvas width="40" height="40"></canvas><span></span></button><button id="slot-1"><canvas width="40" height="40"></canvas><span></span></button><button id="slot-2"><canvas width="40" height="40"></canvas><span></span></button><button id="slot-3"><canvas width="40" height="40"></canvas><span></span></button></div><p>1～4 选技能 · 点击 / 空格释放 · 无冷却</p></section>
<div id="notice" role="status"></div><script type="module" src="player.js"></script></body></html>
